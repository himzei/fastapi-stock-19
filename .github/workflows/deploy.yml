name: Deploy to EC2

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH key
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          HOST="$(echo "$EC2_HOST" | tr -d '[:space:]')"
          if [ -z "$HOST" ]; then echo "::error::EC2_HOST secret이 비어 있습니다."; exit 1; fi
          if [ -z "$EC2_SSH_KEY" ]; then echo "::error::EC2_SSH_KEY secret이 비어 있습니다."; exit 1; fi
          echo "EC2_HOST=$HOST" >> "$GITHUB_ENV"

          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null || { echo "::error::EC2_SSH_KEY 형식이 올바르지 않습니다. .pem 파일 전체를 붙여넣으세요."; exit 1; }
          ssh-keyscan -T 15 "$HOST" >> ~/.ssh/known_hosts || { echo "::error::$HOST:22 에 접속할 수 없습니다."; exit 1; }

      - name: Deploy
        run: |
          ssh -i ~/.ssh/deploy_key ubuntu@"$EC2_HOST" 'bash -s' <<'EOF'
          set -e
          cd ~/fastapi-stock-19
          git fetch origin master
          git reset --hard origin/master
          uv sync --frozen
          sudo systemctl restart fastapi-stock
          sleep 5
          systemctl is-active fastapi-stock
          curl -sf http://127.0.0.1:8000/ > /dev/null && echo "Health check OK"
          EOF
